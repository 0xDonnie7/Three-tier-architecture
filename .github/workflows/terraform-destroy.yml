name: Terraform Destroy

# Manual only: click "Run workflow" in the Actions tab.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        type: choice
        options:
          - dev
          - prod
        required: true
      confirm:
        description: "Type the environment name again to confirm"
        type: string
        required: true

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.10.5"  # keep in step with the version you use locally

jobs:
  destroy:
    name: Destroy (${{ inputs.environment }})
    runs-on: ubuntu-latest

    # Only from main, and only if the confirmation matches
    if: github.ref == 'refs/heads/main' && inputs.confirm == inputs.environment

    # Required reviewers on "prod" also gate this workflow
    environment: ${{ inputs.environment }}

    concurrency:
      group: terraform-apply-${{ inputs.environment }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: envs/${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: tf-destroy-${{ inputs.environment }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      - name: Show what will be destroyed
        run: terraform plan -destroy -no-color -input=false -lock-timeout=5m

      - name: Destroy
        run: terraform destroy -auto-approve -no-color -input=false -lock-timeout=5m