name: Terraform Apply

# Deploys on merge to main: dev first, then prod.
on:
  push:
    branches: [main]
    paths:
      - "envs/**"
      - "modules/**"

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.10.5"  # keep in step with the version you use locally

jobs:
  apply:
    name: Apply (${{ matrix.environment }})
    runs-on: ubuntu-latest

    # Each job pauses here if the GitHub Environment has required reviewers.
    # Add reviewers to "prod" for a manual approval gate.
    environment: ${{ matrix.environment }}

    # One at a time, in order: dev, then prod.
    # If dev fails, prod does not run.
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        environment: [dev, prod]

    # Never run two applies against the same environment at once
    concurrency:
      group: terraform-apply-${{ matrix.environment }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: envs/${{ matrix.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: tf-apply-${{ matrix.environment }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        run: terraform plan -no-color -input=false -lock-timeout=5m -out=tfplan

      # Applies exactly the plan created in the previous step
      - name: Apply
        run: terraform apply -no-color -input=false -lock-timeout=5m tfplan

      - name: Show outputs
        run: terraform output